name: build-and-test

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build (netstandard2.1 + net8.0)
        run: dotnet build -c Release --no-restore
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test -c Release --no-build --logger "console;verbosity=detailed" 2>&1 | tee test.txt
      - name: Failed tests (annotation)
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          text = open('test.txt', encoding='utf-8', errors='replace').read()
          for m in re.finditer(r'\n\s+Failed (\S+)[^\n]*\n(.*?)(?=\n\s+(?:Passed|Failed) |\Z)', text, re.S):
              body = (m.group(1) + '\n' + m.group(2))[:3800]
              print('::error title=Failed test::' + body.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          for m in re.finditer(r'[^\n]*error CS\d+[^\n]*', text):
              print('::error title=Compiler error::' + m.group(0)[:500])
          PY
      - name: Station planner report (annotation)
        if: always()
        shell: bash
        run: |
          dotnet test tests/NaturalGasPipeline.Network.Tests -c Release --no-build \
            --filter "FullyQualifiedName~StationPlannerTests" \
            --logger "console;verbosity=detailed" > planner.txt || true
          python3 - <<'PY'
          import re
          text = open('planner.txt', encoding='utf-8', errors='replace').read()
          # One chunk per test: the "Passed/Failed <name>" line and its output.
          chunks = re.split(r'\n(?=\s+(?:Passed|Failed) )', text)
          chunks = [c for c in chunks if re.match(r'\s+(Passed|Failed) ', c)]
          chunks.sort(key=lambda c: (('Failed' not in c.split('\n')[0]), ('Terrain' not in c and 'Compare' not in c)))
          parts = []
          for c in chunks:
              lines = [l.rstrip() for l in c.split('\n') if l.strip() and not l.strip().startswith('Standard Output')]
              part = ''
              for l in lines:
                  if len(part) + len(l) > 3800:
                      parts.append(part)
                      part = ''
                  part += l + '\n'
              parts.append(part)
          for body in parts[:10]:
              print('::notice title=StationPlannerTests::' + body.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY

      - name: Z model benchmark report (annotation)
        if: always()
        shell: bash
        run: |
          dotnet test tests/NaturalGasPipeline.Thermodynamics.Tests -c Release --no-build \
            --filter "FullyQualifiedName~NaturalGasZBenchmarkTests|FullyQualifiedName~Aga8DetailTests" \
            --logger "console;verbosity=detailed" > zbench.txt || true
          python3 - <<'PY'
          import re
          text = open('zbench.txt', encoding='utf-8', errors='replace').read()
          chunks = re.split(r'\n(?=\s+(?:Passed|Failed) )', text)
          chunks = [c for c in chunks if re.match(r'\s+(Passed|Failed) ', c)]
          keep = [c for c in chunks if 'Failed' in c.split('\n')[0] or 'Benchmark' in c or 'NistCheckPoint' in c]
          totals = re.findall(r'(Total tests: \d+|Passed: \d+|Failed: \d+)', text)
          parts = ['Aga8DetailTests + NaturalGasZBenchmarkTests: ' + ', '.join(totals)]
          for c in keep:
              lines = [l.rstrip() for l in c.split('\n') if l.strip() and not l.strip().startswith('Standard Output')]
              part = ''
              for l in lines:
                  if len(part) + len(l) > 3800:
                      parts.append(part)
                      part = ''
                  part += l + '\n'
              parts.append(part)
          for body in parts[:10]:
              print('::notice title=ZBenchmark::' + body.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY

      - name: Mechanics pending review (annotation)
        if: always()
        shell: bash
        run: |
          dotnet test tests/NaturalGasPipeline.Mechanics.Tests -c Release --no-build \
            --filter "FullyQualifiedName~MechanicsReviewTests|FullyQualifiedName~ConceptCasePipe_Report" \
            --logger "console;verbosity=detailed" > mech.txt || true
          python3 - <<'PY'
          text = open('mech.txt', encoding='utf-8', errors='replace').read()
          lines = [l.rstrip() for l in text.split('\n') if l.strip().startswith(('MECHANICS', '[M-', 'OD ', 'grade', 'L360', 'L450', 'L485'))]
          body = '\n'.join(lines)[:3800] or 'no output captured'
          print('::warning title=Mechanics pending review::' + body.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY

  unity-plugins:
    # Publishes the netstandard2.1 engine DLLs (what Unity 6 loads) to the
    # branch "unity-plugins", from which the Unity project takes them.
    needs: test
    # Only master publishes: a push to a work branch must not overwrite the
    # DLLs the Unity project copies (see SOURCE.txt on unity-plugins).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build for Unity (netstandard2.1)
        run: |
          dotnet publish src/NaturalGasPipeline.Network/NaturalGasPipeline.Network.csproj -c Release -f netstandard2.1 -o "$RUNNER_TEMP/pub"
          mkdir -p "$RUNNER_TEMP/plugins"
          cp "$RUNNER_TEMP"/pub/*.dll "$RUNNER_TEMP"/pub/*.xml "$RUNNER_TEMP/plugins/"
          echo "source: ${GITHUB_REF_NAME}@${GITHUB_SHA}" > "$RUNNER_TEMP/plugins/SOURCE.txt"
          ls -l "$RUNNER_TEMP/plugins"
      - name: Push to branch unity-plugins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan unity-plugins-build
          git clean -fdx -q
          cp "$RUNNER_TEMP"/plugins/* .
          git add -A
          git commit -q -m "Unity plugins from ${GITHUB_REF_NAME}@${GITHUB_SHA}"
          git push -f origin HEAD:refs/heads/unity-plugins
